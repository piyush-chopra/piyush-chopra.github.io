<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Portfolio social preview</title>
    <style>
      @font-face {
        font-family: Manrope;
        src: url("../assets/fonts/manrope.woff2");
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #203b2e;
        color: #edf2e6;
        font-family: Manrope, sans-serif;
        width: 1200px;
        height: 630px;
        padding: 65px 75px;
        background-image:
          linear-gradient(#ffffff05 1px, transparent 1px),
          linear-gradient(90deg, #ffffff05 1px, transparent 1px);
        background-size: 35px 35px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        font-size: 18px;
        color: #b5c7a5;
      }
      .name {
        font-size: 26px;
        font-weight: 700;
        color: #edf2e6;
      }
      h1 {
        font-size: 79px;
        line-height: 1.08;
        letter-spacing: -5px;
        font-weight: 500;
        margin: 72px 0 30px;
      }
      h1 span {
        color: #cbe799;
      }
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: end;
        font-size: 18px;
        color: #c1ceb5;
      }
      .mark {
        font-size: 68px;
        letter-spacing: -5px;
        color: #cbe799;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <span class="name">Piyush Chopra</span><span>BooleanDev / Portfolio</span>
    </div>
    <h1>Complex systems.<br /><span>Useful products.</span></h1>
    <div class="bottom">
      <div>Senior Software Engineer<br />Full-Stack & Agentic AI</div>
      <span class="mark">pc.</span>
    </div>
  </body>
</html>
