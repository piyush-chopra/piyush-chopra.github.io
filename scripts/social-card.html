<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Portfolio social preview</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html {
        color-scheme: light;
      }
      body {
        width: 1200px;
        height: 630px;
        padding: 52px 64px;
        background: #f5f5f7;
        color: #1d1d1f;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 17px;
        color: #626268;
      }
      .name {
        font-size: 23px;
        font-weight: 600;
        color: #1d1d1f;
      }
      .intelligence-art {
        position: absolute;
        top: 106px;
        right: 50px;
        transform: scale(1.2);
      }
      h1 {
        font-size: 73px;
        letter-spacing: -0.055em;
        line-height: 1.08;
        margin-top: 92px;
        text-align: left;
        max-width: 940px;
      }
      h1 span {
        color: #626268;
      }
      .bottom {
        border-top: 1px solid #dcdce3;
        padding-top: 27px;
        margin-top: 54px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 17px;
        color: #626268;
      }
      .specialty {
        color: #673dcc;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <span class="name">Piyush Chopra</span
      ><span>piyush-chopra.github.io</span>
    </div>
    <div class="intelligence-art" aria-hidden="true">
      <div class="spectrum-halo"></div>
      <div class="spectrum-sculpture">
        <i class="spectrum-loop loop-one"></i
        ><i class="spectrum-loop loop-two"></i
        ><i class="spectrum-loop loop-three"></i
        ><span class="spectrum-core"></span>
      </div>
    </div>
    <h1>
      Intelligence,<br />engineered.<br /><span>Products, made human.</span>
    </h1>
    <div class="bottom">
      <span>Senior Software Engineer</span
      ><span class="specialty">Full-Stack & Agentic AI</span>
    </div>
  </body>
</html>
